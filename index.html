<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hourglass Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window-container">
    <!-- Custom Frameless Titlebar -->
    <header class="titlebar" id="titlebar">
      <div class="app-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 22h14M5 2h14M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path>
        </svg>
        <span class="brand-title">Hourglass</span>
      </div>
      <div class="window-controls">
        <button id="btn-minimize" class="win-btn" title="Minimize Window">
          <svg viewBox="0 0 12 12" width="10" height="10"><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button id="btn-close-tray" class="win-btn win-close" title="Minimize to System Tray">
          <svg viewBox="0 0 12 12" width="10" height="10">
            <line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/>
            <line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Visual Animation Viewport -->
      <section class="visualizer-container">
        <!-- 4 Animation Mode Switcher Tabs -->
        <div class="visualizer-toggle">
          <button id="mode-hourglass" class="toggle-tab active" title="Hourglass Animation">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 22h14M5 2h14M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path>
            </svg>
            Hourglass
          </button>
          <button id="mode-ring" class="toggle-tab" title="Radial Gradient Ring">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Ring
          </button>
          <button id="mode-liquid" class="toggle-tab" title="Liquid Cylinder Wave">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
            </svg>
            Liquid
          </button>
          <button id="mode-pulse" class="toggle-tab" title="Neon Pulse Glow">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            Pulse
          </button>
        </div>

        <!-- Animation Stages -->

        <!-- 1. Hourglass Animation Graphic -->
        <div id="hourglass-stage" class="animation-stage">
          <div class="hourglass-wrapper">
            <svg class="hourglass-svg" viewBox="0 0 200 280" preserveAspectRatio="xMidYMid meet">
              <defs>
                <linearGradient id="sandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fcd34d"/>
                  <stop offset="50%" stop-color="#f59e0b"/>
                  <stop offset="100%" stop-color="#d97706"/>
                </linearGradient>

                <clipPath id="topChamberClip">
                  <polygon points="35,38 165,38 108,135 92,135" />
                </clipPath>

                <clipPath id="bottomChamberClip">
                  <polygon points="92,145 108,145 165,242 35,242" />
                </clipPath>
              </defs>

              <!-- Frames -->
              <rect x="25" y="16" width="150" height="12" rx="4" class="frame-wood" />
              <rect x="35" y="28" width="130" height="6" rx="2" class="frame-accent" />
              <rect x="35" y="246" width="130" height="6" rx="2" class="frame-accent" />
              <rect x="25" y="252" width="150" height="12" rx="4" class="frame-wood" />

              <path class="glass-outer-glow" d="M 32 36 Q 100 138 96 140 Q 100 142 32 244 L 168 244 Q 100 142 104 140 Q 100 138 168 36 Z" />

              <!-- Top Sand Masked Level -->
              <g clip-path="url(#topChamberClip)">
                <rect id="top-sand-rect" x="20" y="38" width="160" height="100" fill="url(#sandGrad)" />
              </g>

              <!-- Bottom Sand Mound -->
              <g clip-path="url(#bottomChamberClip)">
                <path id="bottom-sand-mound" d="M 35 244 Q 100 244 165 244 L 165 244 L 35 244 Z" fill="url(#sandGrad)" />
              </g>

              <!-- Falling Sand Stream -->
              <line id="sand-stream" x1="100" y1="135" x2="100" y2="240" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" class="sand-stream" />
              
              <!-- Sand Particles Canvas -->
              <foreignObject x="90" y="135" width="20" height="110">
                <canvas id="sand-particles-canvas" width="20" height="110"></canvas>
              </foreignObject>

              <path class="glass-contour" d="M 32 36 Q 100 138 96 140 Q 100 142 32 244 L 168 244 Q 100 142 104 140 Q 100 138 168 36 Z" />
              <path class="glass-reflection" d="M 40 42 Q 95 136 94 140 Q 95 144 40 238" />

              <!-- Side Pillars -->
              <rect x="22" y="28" width="6" height="224" rx="2" class="frame-pillar" />
              <rect x="172" y="28" width="6" height="224" rx="2" class="frame-pillar" />
            </svg>
          </div>
        </div>

        <!-- 2. Ring Animation Graphic -->
        <div id="ring-stage" class="animation-stage" style="display: none;">
          <div class="ring-wrapper">
            <svg class="progress-ring" width="190" height="190" viewBox="0 0 200 200">
              <defs>
                <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f59e0b" />
                  <stop offset="50%" stop-color="#ec4899" />
                  <stop offset="100%" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
              <circle class="ring-track" cx="100" cy="100" r="82" />
              <circle id="ring-progress" class="ring-bar" cx="100" cy="100" r="82" />
            </svg>
            <div class="ring-center-info">
              <span id="ring-percentage" class="percentage-label">0%</span>
              <span class="sub-label">ELAPSED</span>
            </div>
          </div>
        </div>

        <!-- 3. Liquid Cylinder Stage -->
        <div id="liquid-stage" class="animation-stage" style="display: none;">
          <div class="liquid-cylinder">
            <div class="liquid-surface-container">
              <div id="liquid-fill" class="liquid-fill">
                <div class="wave wave1"></div>
                <div class="wave wave2"></div>
              </div>
            </div>
            <div class="cylinder-glass-sheen"></div>
            <div class="cylinder-markers">
              <span>75%</span>
              <span>50%</span>
              <span>25%</span>
            </div>
          </div>
        </div>

        <!-- 4. Pulse Stage -->
        <div id="pulse-stage" class="animation-stage" style="display: none;">
          <div class="pulse-wrapper">
            <div class="pulse-halo halo-3"></div>
            <div class="pulse-halo halo-2"></div>
            <div class="pulse-halo halo-1"></div>
            <div class="pulse-core">
              <span id="pulse-percentage" class="pulse-percentage-label">100%</span>
              <span class="pulse-sub">REMAINING</span>
            </div>
          </div>
        </div>

        <!-- Primary Digital Clock Readout -->
        <div class="timer-display-box">
          <div class="time-readout" id="time-display">00:25:00</div>
          <div class="time-status" id="time-status">READY</div>
        </div>
      </section>

      <!-- Input Settings & Presets -->
      <section class="timer-config" id="timer-config">
        <!-- Quick Presets -->
        <div class="preset-chips">
          <button class="chip" data-time="60">1m</button>
          <button class="chip" data-time="300">5m</button>
          <button class="chip" data-time="900">15m</button>
          <button class="chip active-chip" data-time="1500">25m</button>
          <button class="chip" data-time="3600">1h</button>
        </div>

        <!-- Custom Manual Input Pickers -->
        <div class="time-inputs-row">
          <div class="input-group">
            <input type="number" id="input-hours" min="0" max="99" value="0" placeholder="00">
            <label>Hours</label>
          </div>
          <span class="colon">:</span>
          <div class="input-group">
            <input type="number" id="input-minutes" min="0" max="59" value="25" placeholder="25">
            <label>Mins</label>
          </div>
          <span class="colon">:</span>
          <div class="input-group">
            <input type="number" id="input-seconds" min="0" max="59" value="0" placeholder="00">
            <label>Secs</label>
          </div>
        </div>
      </section>

      <!-- Sound Selection Row -->
      <section class="sound-selection-section">
        <div class="sound-select-box">
          <div class="sound-select-left">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <label for="sound-selector">Alert Sound:</label>
            <select id="sound-selector" class="sound-dropdown">
              <option value="beep" selected>Beep (Default)</option>
              <option value="chime">Chime Bell</option>
              <option value="digital">Digital Alarm</option>
              <option value="zen">Zen Gong</option>
              <option value="custom">Custom Audio File...</option>
            </select>
          </div>
          <div class="sound-select-right">
            <button id="btn-sound-preview" class="sound-tool-btn" title="Preview Alert Sound">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>Test</span>
            </button>
            <button id="btn-custom-file" class="sound-tool-btn custom-file-btn" style="display: none;" title="Choose local audio file">
              <span>Choose...</span>
            </button>
          </div>
        </div>
        <div id="custom-filename" class="custom-filename-display" style="display: none;"></div>
      </section>

      <!-- Actions Bar -->
      <section class="controls-section">
        <div class="secondary-toggles">
          <button id="btn-loop" class="action-toggle" title="Auto-restart timer on completion">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 2l4 4-4 4"></path>
              <path d="M3 11v-1a4 4 0 0 1 4-4h14"></path>
              <path d="M7 22l-4-4 4-4"></path>
              <path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
            </svg>
            <span>Loop: <strong id="loop-state-text">OFF</strong></span>
          </button>

          <button id="btn-sound-mute" class="action-toggle active" title="Mute/Unmute sound alerts">
            <svg id="sound-icon-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg id="sound-icon-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
            <span id="sound-mute-label">Audio On</span>
          </button>

          <button id="btn-notification-toggle" class="action-toggle active" title="Enable/Disable Windows desktop notifications">
            <svg id="notif-icon-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <svg id="notif-icon-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              <path d="M18.63 13A17.89 17.89 0 0 1 18 8"></path>
              <path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            <span id="notif-toggle-label">Notify On</span>
          </button>
        </div>

        <!-- Main Action Buttons -->
        <div class="primary-buttons">
          <button id="btn-reset" class="btn-secondary" title="Reset Timer">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>
          <button id="btn-play-pause" class="btn-primary" title="Start Timer">
            <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="icon-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display: none;">
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
            </svg>
            <span id="play-btn-text">Start Timer</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Footer Status -->
    <footer class="app-footer">
      <div class="tray-tip">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Closing window keeps it running in the Taskbar Tray</span>
      </div>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
